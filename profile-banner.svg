<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Bioinformatics and molecular genetics banner</title>
  <desc id="bannerDesc">A banner combining bioinformatics code motifs with molecular genetics laboratory apparatus including a DNA double helix, micropipette, Erlenmeyer flask, test tubes, and a microscope.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1628"/>
      <stop offset="0.5" stop-color="#12324A"/>
      <stop offset="1" stop-color="#0D3B3A"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20C997"/>
      <stop offset="1" stop-color="#61D6CD"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8B36A"/>
      <stop offset="1" stop-color="#F0D9A8"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20C997" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0E8C74" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="liquidBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BA8D9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2C6FA8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="liquidGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8B36A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#B8860B" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="180" cy="60" r="160" fill="#20C997" opacity="0.035" filter="url(#blurHeavy)"/>
  <circle cx="1080" cy="260" r="200" fill="#D8B36A" opacity="0.03" filter="url(#blurHeavy)"/>
  <circle cx="620" cy="160" r="300" fill="#12324A" opacity="0.25" filter="url(#blurHeavy)"/>

  <!-- ============ LEFT SIDE: BIOINFORMATICS CODE ============ -->
  <g transform="translate(42 40)" font-family="'JetBrains Mono','Fira Code','Consolas','Courier New',monospace" font-size="11" opacity="0.5">
    <text x="0" y="0" fill="#4A6B7A"><tspan fill="#61D6CD">&gt;&gt;&gt;</tspan> <tspan fill="#C8DCE4">from</tspan> <tspan fill="#D8B36A">Bio</tspan> <tspan fill="#C8DCE4">import</tspan> <tspan fill="#8ED0C8">SeqIO</tspan></text>
    <text x="0" y="20" fill="#4A6B7A"><tspan fill="#C8DCE4">record</tspan> <tspan fill="#61D6CD">=</tspan> <tspan fill="#8ED0C8">SeqIO.read</tspan><tspan fill="#5A7A8A">(</tspan><tspan fill="#A6D785">"genome.fasta"</tspan><tspan fill="#5A7A8A">,</tspan> <tspan fill="#A6D785">"fasta"</tspan><tspan fill="#5A7A8A">)</tspan></text>
    <text x="0" y="40" fill="#4A6B7A"><tspan fill="#C8DCE4">gc</tspan> <tspan fill="#61D6CD">=</tspan> <tspan fill="#8ED0C8">calc_gc_content</tspan><tspan fill="#5A7A8A">(</tspan><tspan fill="#C8DCE4">record.seq</tspan><tspan fill="#5A7A8A">,</tspan> <tspan fill="#C8DCE4">window</tspan><tspan fill="#61D6CD">=</tspan><tspan fill="#D8B36A">1000</tspan><tspan fill="#5A7A8A">)</tspan></text>
    <text x="0" y="60" fill="#4A6B7A"><tspan fill="#8ED0C8">plot_gc_profile</tspan><tspan fill="#5A7A8A">(</tspan><tspan fill="#C8DCE4">gc</tspan><tspan fill="#5A7A8A">,</tspan> <tspan fill="#C8DCE4">label</tspan><tspan fill="#61D6CD">=</tspan><tspan fill="#A6D785">"K-12 MG1655"</tspan><tspan fill="#5A7A8A">)</tspan></text>
    <text x="0" y="86" fill="#4A6B7A"><tspan fill="#61D6CD">&gt;&gt;&gt;</tspan> <tspan fill="#8ED0C8">blastn</tspan><tspan fill="#5A7A8A">(</tspan><tspan fill="#C8DCE4">query</tspan><tspan fill="#61D6CD">=</tspan><tspan fill="#A6D785">"KCNQ5_HUMAN"</tspan><tspan fill="#5A7A8A">,</tspan> <tspan fill="#C8DCE4">db</tspan><tspan fill="#61D6CD">=</tspan><tspan fill="#A6D785">"nr"</tspan><tspan fill="#5A7A8A">,</tspan> <tspan fill="#C8DCE4">evalue</tspan><tspan fill="#61D6CD">=</tspan><tspan fill="#D8B36A">1e-10</tspan><tspan fill="#5A7A8A">)</tspan></text>
    <text x="0" y="106" fill="#4A6B7A"><tspan fill="#C8DCE4">alignment</tspan> <tspan fill="#61D6CD">=</tspan> <tspan fill="#8ED0C8">MAFFT</tspan><tspan fill="#5A7A8A">(</tspan><tspan fill="#C8DCE4">orthologs</tspan><tspan fill="#5A7A8A">)</tspan></text>
    <text x="0" y="126" fill="#4A6B7A"><tspan fill="#C8DCE4">tree</tspan> <tspan fill="#61D6CD">=</tspan> <tspan fill="#8ED0C8">IQTREE</tspan><tspan fill="#5A7A8A">(</tspan><tspan fill="#C8DCE4">alignment</tspan><tspan fill="#5A7A8A">,</tspan> <tspan fill="#C8DCE4">bootstrap</tspan><tspan fill="#61D6CD">=</tspan><tspan fill="#D8B36A">1000</tspan><tspan fill="#5A7A8A">)</tspan></text>
    <text x="0" y="146" fill="#4A6B7A"><tspan fill="#C8DCE4">conservation</tspan> <tspan fill="#61D6CD">=</tspan> <tspan fill="#8ED0C8">calc_shannon</tspan><tspan fill="#5A7A8A">(</tspan><tspan fill="#C8DCE4">alignment</tspan><tspan fill="#5A7A8A">)</tspan></text>
    <text x="0" y="166" fill="#4A6B7A"><tspan fill="#8ED0C8">figure.savefig</tspan><tspan fill="#5A7A8A">(</tspan><tspan fill="#A6D785">"kcnq_conservation.png"</tspan><tspan fill="#5A7A8A">,</tspan> <tspan fill="#C8DCE4">dpi</tspan><tspan fill="#61D6CD">=</tspan><tspan fill="#D8B36A">300</tspan><tspan fill="#5A7A8A">)</tspan></text>
    <text x="0" y="192" fill="#4A6B7A"><tspan fill="#61D6CD">$</tspan> <tspan fill="#C8DCE4">samtools</tspan> <tspan fill="#D8B36A">view</tspan> <tspan fill="#A6D785">-b</tspan> <tspan fill="#C8DCE4">aligned.bam</tspan> <tspan fill="#5A7A8A">|</tspan> <tspan fill="#C8DCE4">bcftools</tspan> <tspan fill="#D8B36A">call</tspan> <tspan fill="#A6D785">-mv</tspan> <tspan fill="#5A7A8A">&gt;</tspan> <tspan fill="#C8DCE4">variants.vcf</tspan></text>
    <text x="0" y="212" fill="#4A6B7A"><tspan fill="#C8DCE4">DESeq2</tspan><tspan fill="#5A7A8A">(</tspan><tspan fill="#C8DCE4">countData</tspan><tspan fill="#5A7A8A">,</tspan> <tspan fill="#C8DCE4">design</tspan><tspan fill="#61D6CD">=</tspan><tspan fill="#A6D785">~ condition</tspan><tspan fill="#5A7A8A">)</tspan></text>
    <text x="0" y="232" fill="#4A6B7A"><tspan fill="#8ED0C8">fig, ax</tspan> <tspan fill="#61D6CD">=</tspan> <tspan fill="#8ED0C8">plt.subplots</tspan><tspan fill="#5A7A8A">(</tspan><tspan fill="#C8DCE4">figsize</tspan><tspan fill="#61D6CD">=</tspan><tspan fill="#5A7A8A">(</tspan><tspan fill="#D8B36A">10</tspan><tspan fill="#5A7A8A">,</tspan> <tspan fill="#D8B36A">6</tspan><tspan fill="#5A7A8A">))</tspan></text>
    <text x="0" y="252" fill="#4A6B7A"><tspan fill="#C8DCE4">ax.scatter</tspan><tspan fill="#5A7A8A">(</tspan><tspan fill="#C8DCE4">log2fc</tspan><tspan fill="#5A7A8A">,</tspan> <tspan fill="#C8DCE4">-log10_padj</tspan><tspan fill="#5A7A8A">,</tspan> <tspan fill="#C8DCE4">c</tspan><tspan fill="#61D6CD">=</tspan><tspan fill="#A6D785">"de_genes"</tspan><tspan fill="#5A7A8A">)</tspan></text>
  </g>

  <!-- ============ CENTER: DNA DOUBLE HELIX ============ -->
  <g transform="translate(520 20)" filter="url(#softGlow)" opacity="0.9">
    <!-- Strand 1 -->
    <path d="M80 20 C20 55 80 85 20 120 C-40 155 20 185 -40 220 C-80 245 -40 265 -40 290" fill="none" stroke="#61D6CD" stroke-width="5" stroke-linecap="round"/>
    <!-- Strand 2 -->
    <path d="M-40 20 C20 55 -40 85 20 120 C80 155 20 185 80 220 C120 245 80 265 80 290" fill="none" stroke="#D8B36A" stroke-width="5" stroke-linecap="round"/>
    <!-- Base pairs -->
    <g stroke="#C8DCE4" stroke-width="2.5" opacity="0.65" stroke-linecap="round">
      <line x1="56" y1="38" x2="-16" y2="38"/>
      <line x1="34" y1="63" x2="6" y2="63"/>
      <line x1="42" y1="90" x2="-2" y2="90"/>
      <line x1="20" y1="115" x2="20" y2="115"/>
      <line x1="42" y1="140" x2="-2" y2="140"/>
      <line x1="34" y1="165" x2="6" y2="165"/>
      <line x1="56" y1="190" x2="-16" y2="190"/>
      <line x1="34" y1="215" x2="6" y2="215"/>
      <line x1="42" y1="240" x2="-2" y2="240"/>
      <line x1="56" y1="265" x2="-16" y2="265"/>
    </g>
    <!-- Nucleotide markers -->
    <circle cx="56" cy="38" r="3" fill="#61D6CD"/>
    <circle cx="-16" cy="38" r="3" fill="#D8B36A"/>
    <circle cx="20" cy="115" r="3" fill="#61D6CD"/>
    <circle cx="42" cy="90" r="3" fill="#61D6CD"/>
    <circle cx="-2" cy="90" r="3" fill="#D8B36A"/>
    <circle cx="-16" cy="190" r="3" fill="#D8B36A"/>
    <circle cx="56" cy="190" r="3" fill="#61D6CD"/>
    <circle cx="56" cy="265" r="3" fill="#61D6CD"/>
    <circle cx="-16" cy="265" r="3" fill="#D8B36A"/>
  </g>

  <!-- ============ RIGHT SIDE: LAB APPARATUS ============ -->

  <!-- Erlenmeyer Flask -->
  <g transform="translate(760 130)">
    <path d="M15 0 L15 35 L-20 95 Q-25 105 -15 105 L45 105 Q55 105 50 95 L15 35 L15 0" fill="none" stroke="#8FB8C8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M8 0 L8 38 L-12 88 Q-16 96 -8 96 L38 96 Q46 96 42 88 L22 38 L22 0" fill="url(#liquid)"/>
    <line x1="10" y1="0" x2="20" y2="0" stroke="#8FB8C8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="4" cy="55" r="2" fill="#61D6CD" opacity="0.6"/>
    <circle cx="25" cy="72" r="1.5" fill="#61D6CD" opacity="0.5"/>
    <circle cx="12" cy="82" r="2.5" fill="#61D6CD" opacity="0.4"/>
  </g>

  <!-- Test tubes -->
  <g transform="translate(860 140)">
    <g transform="translate(0 0)">
      <path d="M0 0 L0 50 Q0 60 8 60 Q16 60 16 50 L16 0" fill="url(#liquidBlue)" stroke="#8FB8C8" stroke-width="1.8"/>
      <line x1="0" y1="0" x2="16" y2="0" stroke="#8FB8C8" stroke-width="1.8"/>
    </g>
    <g transform="translate(28 12)">
      <path d="M0 0 L0 38 Q0 48 8 48 Q16 48 16 38 L16 0" fill="url(#liquidGold)" stroke="#8FB8C8" stroke-width="1.8"/>
      <line x1="0" y1="0" x2="16" y2="0" stroke="#8FB8C8" stroke-width="1.8"/>
    </g>
    <g transform="translate(56 4)">
      <path d="M0 0 L0 46 Q0 56 8 56 Q16 56 16 46 L16 0" fill="url(#liquid)" stroke="#8FB8C8" stroke-width="1.8"/>
      <line x1="0" y1="0" x2="16" y2="0" stroke="#8FB8C8" stroke-width="1.8"/>
    </g>
  </g>

  <!-- Micropipette -->
  <g transform="translate(985 30)">
    <path d="M0 0 L0 12 L-8 12 L-8 18 L8 18 L8 12 L8 0 Z" fill="#2C3E50" stroke="#5A7A8A" stroke-width="1"/>
    <rect x="-5" y="0" width="10" height="6" rx="2" fill="#D8B36A" opacity="0.8"/>
    <rect x="-3" y="18" width="6" height="35" fill="#3D5A6C" stroke="#5A7A8A" stroke-width="0.8"/>
    <path d="M-3 53 L-3 68 Q-3 74 0 74 Q3 74 3 68 L3 53" fill="#5A7A8A" stroke="#7A9AAA" stroke-width="0.6"/>
    <circle cx="0" cy="-4" r="4" fill="#61D6CD" opacity="0.7"/>
    <line x1="-5" y1="6" x2="5" y2="6" stroke="#61D6CD" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Microscope -->
  <g transform="translate(1060 50)">
    <!-- Arm -->
    <path d="M20 10 Q40 0 40 20 L40 80" fill="none" stroke="#5A7A8A" stroke-width="6" stroke-linecap="round"/>
    <!-- Eyepiece -->
    <rect x="14" y="-8" width="12" height="14" rx="2" fill="#3D5A6C"/>
    <rect x="16" y="-12" width="8" height="6" rx="1" fill="#61D6CD" opacity="0.7"/>
    <!-- Tube -->
    <rect x="16" y="6" width="8" height="40" rx="2" fill="#3D5A6C"/>
    <!-- Objective lenses -->
    <path d="M20 46 L17 54 L23 54 Z" fill="#5A7A8A"/>
    <path d="M20 54 L15 62 L25 62 Z" fill="#5A7A8A" opacity="0.8"/>
    <!-- Stage -->
    <rect x="5" y="62" width="40" height="6" rx="2" fill="#3D5A6C"/>
    <rect x="15" y="58" width="20" height="4" rx="1" fill="#8FB8C8" opacity="0.5"/>
    <!-- Base -->
    <rect x="0" y="78" width="50" height="8" rx="3" fill="#2C3E50"/>
    <!-- Focus knob -->
    <circle cx="46" cy="70" r="5" fill="#3D5A6C" stroke="#5A7A8A" stroke-width="1"/>
    <circle cx="46" cy="70" r="2" fill="#5A7A8A"/>
  </g>

  <!-- Petri dish -->
  <g transform="translate(880 250)">
    <ellipse cx="0" cy="0" rx="28" ry="8" fill="none" stroke="#8FB8C8" stroke-width="2" opacity="0.7"/>
    <ellipse cx="0" cy="2" rx="24" ry="6" fill="#0E8C74" opacity="0.2"/>
    <ellipse cx="0" cy="2" rx="24" ry="6" fill="none" stroke="#61D6CD" stroke-width="1" opacity="0.3"/>
    <circle cx="-8" cy="0" r="4" fill="#20C997" opacity="0.3"/>
    <circle cx="6" cy="1" r="3" fill="#20C997" opacity="0.25"/>
    <circle cx="12" cy="-2" r="2" fill="#20C997" opacity="0.2"/>
  </g>

  <!-- Floating molecules / data points -->
  <g opacity="0.3">
    <circle cx="200" cy="270" r="3" fill="#61D6CD"/>
    <circle cx="420" cy="280" r="2" fill="#D8B36A"/>
    <circle cx="380" cy="40" r="2" fill="#61D6CD"/>
    <circle cx="720" cy="70" r="2.5" fill="#D8B36A"/>
    <circle cx="960" cy="290" r="2" fill="#61D6CD"/>
    <circle cx="1150" cy="30" r="3" fill="#D8B36A" opacity="0.4"/>
    <circle cx="150" cy="250" r="2" fill="#D8B36A"/>
    <circle cx="500" cy="290" r="2.5" fill="#8ED0C8"/>
    <circle cx="1050" cy="160" r="2" fill="#61D6CD" opacity="0.5"/>
    <circle cx="820" cy="25" r="2" fill="#D8B36A" opacity="0.35"/>
  </g>

  <!-- Connecting lines (data flow) -->
  <g stroke="#5A7A8A" stroke-width="1" stroke-dasharray="4 6" opacity="0.3">
    <line x1="350" y1="160" x2="500" y2="160"/>
    <line x1="600" y1="160" x2="740" y2="160"/>
    <line x1="600" y1="220" x2="740" y2="220"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="308" width="1200" height="12" fill="url(#goldGrad)" opacity="0.3"/>
  <rect x="0" y="308" width="600" height="12" fill="url(#tealGrad)" opacity="0.3"/>
</svg>
